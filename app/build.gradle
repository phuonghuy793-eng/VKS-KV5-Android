plugins {
    id 'com.android.application'
}

android {
    namespace 'vn.dongthap.vkskv5'
    compileSdk 35

    defaultConfig {
        applicationId 'vn.dongthap.vkskv5'
        minSdk 24
        targetSdk 35
        versionCode 6
        versionName '2.2.3'
        manifestPlaceholders = [appLabel: 'VKSKV5-ĐT']
    }
    // Parallel-install package only on this isolated branch. The main app remains unchanged.
    buildTypes {
        debug {
            applicationIdSuffix '.parallel'
            manifestPlaceholders = [appLabel: 'VKSKV5-ĐT (2)']
        }
    }
}
dependencies {
    implementation 'com.google.ar:core:1.56.0'
}
