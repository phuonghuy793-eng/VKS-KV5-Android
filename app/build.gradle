plugins {
    id 'com.android.application'
}

android {
    namespace 'vn.dongthap.vkskv5'
    compileSdk 35

    defaultConfig {
        applicationId 'vn.dongthap.vkskv5'
        minSdk 24
        targetSdk 35
        versionCode 6
        versionName '2.2.3'
        manifestPlaceholders = [appLabel: 'VKSKV5-ĐT']
    }
    // Debug builds use a different package so test installs never require removing users' existing App VKS.
    buildTypes {
        debug {
            applicationIdSuffix '.artest'
            versionNameSuffix '-test'
            manifestPlaceholders = [appLabel: 'VKS AR Thử nghiệm']
        }
    }
}
dependencies {
    implementation 'com.google.ar:core:1.56.0'
}
