name: Build VKS AR Meter APK
on:
  push:
    branches: [feature/ar-meter-native-v2]
    paths:
      - "android-ar-meter/**"
      - ".github/workflows/vks-ar-apk.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          which sdkmanager
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile new native ARCore APK
        run: gradle -p android-ar-meter :app:assembleDebug --no-daemon --stacktrace
      - name: Verify APK exists
        run: |
          test -s android-ar-meter/app/build/outputs/apk/debug/app-debug.apk
          unzip -t android-ar-meter/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: VKS-AR-METER-APK
          path: android-ar-meter/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
